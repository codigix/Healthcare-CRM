name: Deploy Healthcare-CRM to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true   # stop at the first failing command
          script: |
            set -e            # never restart the apps if any build step failed
            cd /var/www/Healthcare-CRM
            git pull --ff-only origin main

            # Backend: the TypeScript build needs devDependencies, so install them
            # all, then generate the Prisma client and build.
            cd backend
            npm ci
            npx prisma generate
            npm run build
            cd ..

            # Frontend (Next.js)
            cd frontend
            npm ci
            npm run build
            cd ..

            # Restart PM2 apps (only reached if everything above succeeded)
            pm2 restart healthcare-frontend
            pm2 restart healthcare-backend
